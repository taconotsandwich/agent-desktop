name: Desktop QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-qa
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: desktop
            desktop: KDE
            protocol: wayland
            render_device: /dev/dri
          - suite: desktop
            desktop: KDE
            protocol: x11
          - suite: desktop
            desktop: GNOME
            protocol: wayland
          - suite: farm
            desktop: KDE
            protocol: wayland
            render_device: /dev/dri
    env:
      QA_PACKAGES_DIR: ${{ github.workspace }}/target/npm
      QA_IMAGE: localhost/agent-desktop-qa:fedora43
      QA_ARTIFACTS: ${{ github.workspace }}/target/qa/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.desktop }}-${{ matrix.protocol }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install container runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y podman crun libwayland-dev libxkbcommon-dev dbus-daemon
      - name: Build npm packages
        run: bun packaging/npm/build.ts
      - name: Verify npm and npx installation
        if: matrix.suite == 'desktop' && matrix.desktop == 'KDE' && matrix.protocol == 'wayland'
        run: |
          bun packaging/npm/smoke.ts
          bun packaging/npm/skill-smoke.ts
      - name: Build QA image with cached layers
        run: podman build --layers -t "$QA_IMAGE" -f containers/Containerfile .
      - name: Provision virtual DRM device
        if: matrix.render_device != ''
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          for attempt in {1..120}; do compgen -G "/dev/dri/card*" > /dev/null && break; sleep 0.5; done
          for attempt in {1..30}; do
            for node in /dev/dri/card* /dev/dri/renderD*; do
              if [[ -e "$node" ]]; then sudo chmod 0666 "$node"; fi
            done
            sleep 0.5
          done
          blocked=0
          for node in /dev/dri/card* /dev/dri/renderD*; do
            if [[ -e "$node" && ( ! -r "$node" || ! -w "$node" ) ]]; then blocked=$((blocked + 1)); fi
          done
          if (( blocked > 0 )); then
            echo "DRM nodes are not accessible to the runner user"
            ls -l /dev/dri
            exit 1
          fi
          ls -l /dev/dri
      - name: Run isolated suite
        timeout-minutes: 25
        env:
          QA_SUITE: ${{ matrix.suite }}
          QA_DESKTOP: ${{ matrix.desktop }}
          QA_PROTOCOL: ${{ matrix.protocol }}
          QA_RENDER_DEVICE: ${{ matrix.render_device }}
        run: |
          set -euo pipefail
          row="$QA_SUITE-$QA_DESKTOP-$QA_PROTOCOL"
          name="agent-desktop-qa-${row}-$$"
          staged=$(mktemp -d)
          mkdir -p "$QA_ARTIFACTS"
          cleanup() {
            podman rm -f "$name" > /dev/null 2>&1 || true
            rm -rf "$staged"
          }
          trap cleanup EXIT
          rsync -a --exclude .git --exclude target --exclude .DS_Store ./ "$staged/repo/"
          args=(
            podman run --rm --init --name "$name"
            --userns=keep-id:uid=1000,gid=1000 --user=1000:1000
            --timeout=1200 --shm-size=1g --memory=8g --cpus=4
            -v "$staged/repo:/work:ro,Z"
            -v "agent-desktop-qa-build-$row:/work/target"
            -v "agent-desktop-qa-cargo:/home/qa/.cargo"
            -v "$QA_ARTIFACTS:/artifacts:rw,Z"
            -e "QA_SUITE=$QA_SUITE" -e "QA_DESKTOP=$QA_DESKTOP" -e "QA_PROTOCOL=$QA_PROTOCOL"
          )
          if [[ -n ${QA_PACKAGES_DIR:-} ]]; then
            args+=(-v "$QA_PACKAGES_DIR:/work/npm-packages:ro,Z" -e "QA_PACKAGES_DIR=/work/npm-packages")
          fi
          if [[ -n ${QA_RENDER_DEVICE:-} ]]; then
            args+=(--device "$QA_RENDER_DEVICE" --group-add keep-groups)
          fi
          if [[ "$QA_DESKTOP" == GNOME ]]; then
            args+=(--security-opt label=disable)
          fi
          args+=(--entrypoint /bin/bash "$QA_IMAGE" /work/containers/session.sh)
          status=0
          "${args[@]}" 2>&1 | tee "$QA_ARTIFACTS/run.log" || status=$?
          printf '{"suite":"%s","desktop":"%s","protocol":"%s","status":"%s"}\n' \
            "$QA_SUITE" "$QA_DESKTOP" "$QA_PROTOCOL" \
            "$([[ $status -eq 0 ]] && echo passed || echo failed)" > "$QA_ARTIFACTS/result.json"
          exit "$status"
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.suite }}-${{ matrix.desktop }}-${{ matrix.protocol }}-${{ github.run_attempt }}
          path: ${{ env.QA_ARTIFACTS }}
          retention-days: 14
