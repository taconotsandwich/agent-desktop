name: Desktop QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-qa
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: desktop
            desktop: KDE
            protocol: wayland
            render_device: /dev/dri
          - suite: desktop
            desktop: KDE
            protocol: x11
          - suite: desktop
            desktop: GNOME
            protocol: wayland
          - suite: farm
            desktop: KDE
            protocol: wayland
            render_device: /dev/dri
    env:
      QA_IMAGE: localhost/agent-desktop-qa:fedora43
      QA_ARTIFACTS: ${{ github.workspace }}/target/qa/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.desktop }}-${{ matrix.protocol }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install container runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y podman crun
      - name: Build QA image with cached layers
        run: podman build --layers -t "$QA_IMAGE" -f qa/containers/Containerfile .
      - name: Provision virtual DRM device
        if: matrix.render_device != ''
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          for attempt in {1..120}; do compgen -G "/dev/dri/card*" > /dev/null && break; sleep 0.5; done
          for attempt in {1..120}; do
            blocked=0
            for node in /dev/dri/card* /dev/dri/renderD*; do
              if [[ -e "$node" ]]; then
                sudo chmod 0666 "$node"
                if [[ ! -r "$node" || ! -w "$node" ]]; then blocked=$((blocked + 1)); fi
              fi
            done
            if (( blocked == 0 )); then break; fi
            sleep 0.5
          done
          ls -l /dev/dri
      - name: Run isolated suite
        timeout-minutes: 25
        env:
          QA_SUITE: ${{ matrix.suite }}
          QA_DESKTOP: ${{ matrix.desktop }}
          QA_PROTOCOL: ${{ matrix.protocol }}
          QA_RENDER_DEVICE: ${{ matrix.render_device }}
        run: bun qa/run.ts "$QA_SUITE" "$QA_DESKTOP" "$QA_PROTOCOL"
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.suite }}-${{ matrix.desktop }}-${{ matrix.protocol }}-${{ github.run_attempt }}
          path: ${{ env.QA_ARTIFACTS }}
          retention-days: 14
